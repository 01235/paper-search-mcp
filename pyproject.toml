[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-search-mcp"
version = "0.1.4"
authors = [{ name = "P.S Zhang", email = "pengsongzhang96@gmail.com" }]
description = "A MCP server for searching and downloading academic papers from multiple sources."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "mcp",
    "academic",
    "papers",
    "search",
    "arxiv",
    "pubmed",
    "semantic-scholar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests",
    "feedparser",
    "fastmcp",
    "pypdf",
    "mcp[cli]>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "httpx[socks]>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/openags/paper-search-mcp"
Repository = "https://github.com/openags/paper-search-mcp"
Issues = "https://github.com/openags/paper-search-mcp/issues"

[project.scripts]
paper-search-mcp = "paper_search_mcp.server:main"
paper-search = "paper_search_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["paper_search_mcp"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
# Only test_*.py is the automated suite. e2e_test.py and functional_test.py are
# standalone live-network smoke scripts (see their own docstrings: "Run with:
# python tests/<name>.py") - pytest's *_test.py default would otherwise import
# and execute them (hitting every academic platform's live API) as a side
# effect of collection.
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]
